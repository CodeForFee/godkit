name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # check-versions refuses to publish when the tag and the manifests disagree.
      - run: node scripts/sync-rules.js --check
      - run: node scripts/check-versions.js
      - run: node --test tests/*.test.js

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      # No token: id-token above authenticates via OIDC and attaches provenance.
      - run: npm publish
