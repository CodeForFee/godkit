name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck
      - run: node --test
      - run: node scripts/benchmark.js --output benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-${{ runner.os }}-node${{ matrix.node }}
          path: benchmark.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:artifact
      - run: npm pack --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-benchmark-*
          path: release-metrics
      # Trusted publishing uses OIDC; no long-lived npm token is stored.
      - run: npm install -g npm@latest
      - run: npm publish --provenance
      - name: Attach the exact installers, lock, package and performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes scripts/install.ps1 scripts/install.sh scripts/runtime-lock.json ./*.tgz
          find release-metrics -name benchmark.json -print | while read metric; do
            label="$(basename "$(dirname "$metric")")"
            cp "$metric" "$label.json"
            gh release upload "$GITHUB_REF_NAME" "$label.json"
          done
