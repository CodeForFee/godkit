name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck
      # Includes real npm pack/extract, MCP handshake and the platform bootstrap fixture.
      - run: node --test
      - name: Download last successful main benchmark when available
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_run="$(gh run list --workflow test.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$baseline_run" ]; then
            gh run download "$baseline_run" --name "benchmark-${{ runner.os }}-node${{ matrix.node }}" --dir .baseline
          fi
      - name: Measure performance and compare an equivalent baseline
        shell: bash
        run: |
          if [ -f .baseline/benchmark.json ]; then
            node scripts/benchmark.js --baseline .baseline/benchmark.json --output benchmark.json
          else
            node scripts/benchmark.js --output benchmark.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}-node${{ matrix.node }}
          path: benchmark.json
