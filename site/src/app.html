<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#08080a" />

    <title>Godkit — one shared harness for every AI agent</title>
    <meta
      name="description"
      content="Claude Code, Cursor, Codex and Antigravity all point at the same repo. Godkit gives them one committed board, map and log — so work is not redone and two agents never edit the same file."
    />
    <link rel="canonical" href="https://godkit.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Godkit — one shared harness for every AI agent" />
    <meta
      property="og:description"
      content="One committed .agent/ directory. Read it before you edit, write your log before you finish. Zero dependencies."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
